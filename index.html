<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫码领取</title>
    <style>
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f5f5f5; font-family: sans-serif; }
        .container { text-align: center; }
        img { max-width: 100%; height: auto; display: block; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .blocked { color: red; font-size: 20px; font-weight: bold; padding: 20px; background: #fff; border-radius: 10px; border: 2px solid red; }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- 默认显示的内容，JS 会决定是否隐藏 -->
    <img id="qrImage" src="https://i.postimg.cc/YCsgD2VQ/i-Phone-(14).jpg" alt="扫码领取">
    <div id="blockedMessage" class="blocked" style="display: none;">
        ⚠️ 您的 IP 访问次数已达上限（3次），已被系统屏蔽。
    </div>
</div>

<script>
    // 获取用户公网 IP 的免费 API
    const IP_API_URL = 'https://api.ipify.org?format=json';
    
    // 这里使用 localStorage 模拟记录（仅作为演示，真实情况必须用后端）
    // 因为纯 HTML 无法记录服务器端的 IP 访问次数，这里只能记录当前浏览器的访问次数
    // 如果你真的想记录 IP，必须接入后端，这里仅演示逻辑
    
    async function checkLimit() {
        try {
            // 1. 获取用户 IP
            const response = await fetch(IP_API_URL);
            const data = await response.json();
            const userIp = data.ip;
            
            // 2. 生成一个基于 IP 的 key
            const storageKey = 'visit_count_' + userIp;
            
            // 3. 获取当前访问次数
            let visitCount = parseInt(localStorage.getItem(storageKey) || '0');
            
            // 4. 增加次数
            visitCount++;
            localStorage.setItem(storageKey, visitCount);
            
            console.log('当前 IP: ' + userIp + '，访问次数: ' + visitCount);
            
            // 5. 判断是否超过 3 次
            if (visitCount > 3) {
                // 隐藏图片，显示屏蔽信息
                document.getElementById('qrImage').style.display = 'none';
                document.getElementById('blockedMessage').style.display = 'block';
            } else {
                // 正常显示图片
                document.getElementById('qrImage').style.display = 'block';
                document.getElementById('blockedMessage').style.display = 'none';
            }
            
        } catch (error) {
            console.error('获取 IP 失败:', error);
            // 如果获取 IP 失败，为了不影响用户体验，默认显示图片
            document.getElementById('qrImage').style.display = 'block';
        }
    }

    // 页面加载时执行检查
    window.onload = checkLimit;
</script>

</body>
</html>
